[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "model-router"
version = "0.1.0"
description = "Route each task to the cheapest capable LLM across commercial and open-weight providers (Jev-classifier driven, harness-style routing)."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Chaminda Wijayasundara" }]
keywords = ["llm", "router", "model-routing", "cost-optimization", "jev", "ai-gateway"]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.hatch.build.targets.wheel]
packages = ["src/model_router"]

[tool.pytest.ini_options]
testpaths = ["tests"]
